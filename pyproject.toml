[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dark-mexico-rl"
version = "0.1.0"
description = "Una red neuronal que aprende a pelear contra los jefes de Dark México con imitación y PPO"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Ordi94" }]
dependencies = [
    "torch==2.14.1",
    "numpy==2.5.4",
    "gymnasium==1.4.0",
    "stable_baselines3==2.9.0",
    "sb3_contrib==2.9.0",
    "tensorboard==2.21.0",
    "psutil==7.2.2",
    "lupa==2.8",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "types-psutil==7.2.2.20260906",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dmrl = ["infraestructura/panel_web/*.html"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Los scripts de medición son utilidades de línea de comandos: líneas largas de formato y
# try/except/pass explícitos en la limpieza de procesos se conservan tal cual.
"scripts/*.py" = ["E501", "SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["dmbridge", "dmrl", "tests"]

[tool.mypy]
python_version = "3.12"
files = ["src/dmbridge", "src/dmrl"]
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["lupa", "lupa.*", "sb3_contrib", "sb3_contrib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"

[tool.coverage.run]
source = ["dmbridge", "dmrl"]
branch = false

[tool.coverage.report]
show_missing = true
